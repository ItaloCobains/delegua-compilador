[package]
name = "delegua-compilador"
version = "0.0.0"
edition = "2021"
authors = ["Italo Brito Brandão"]
description = "Um simples compilador para a linguagem Delegua"
license = "MIT"

[workspace]
resolver = "3"
members = ["delegua"]

[dependencies]
delegua = { path = "delegua" }
inkwell = { version = "0.6.0", features = ["llvm18-1"], default-features = false }
reedline = "0.35.0"

[dev-dependencies]
tempfile = "3.0"
criterion = { version = "0.5", features = ["html_reports"] }

